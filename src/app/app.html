<!-- Global Toast Notifications -->
<div class="toast-container" *ngIf="(toasts$ | async) as toasts">
  <div *ngFor="let toast of toasts" class="toast-item" [ngClass]="'toast-' + toast.type">
    <span class="toast-icon">
      <ng-container [ngSwitch]="toast.type">
        <span *ngSwitchCase="'success'">✅</span>
        <span *ngSwitchCase="'error'">❌</span>
        <span *ngSwitchCase="'warning'">⚠️</span>
        <span *ngSwitchDefault>ℹ️</span>
      </ng-container>
    </span>
    <span class="toast-message">{{ toast.message }}</span>
    <button class="toast-close" (click)="removeToast(toast.id)" aria-label="Close notification">×</button>
  </div>
</div>
