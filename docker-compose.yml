version: '3.8'

services:
  # MySQL Database Service
  mysql-db:
    image: mysql:8.0
    container_name: oblms-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Loukika@123
      MYSQL_DATABASE: oblms
    ports:
      - "3306:3306"
    volumes:
      - oblms_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pLoukika@123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend Service
  backend:
    build:
      context: ./springboot-backend
      dockerfile: Dockerfile
    container_name: oblms-backend
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/oblms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Loukika@123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"

  # Angular Frontend Service
  frontend:
    build:
      context: ./outcome-based-lms
      dockerfile: Dockerfile
    container_name: oblms-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  oblms_db_data:
