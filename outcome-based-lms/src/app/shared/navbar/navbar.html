<header class="enterprise-navbar">
    <div class="navbar-left">
        <button type="button" class="nav-sidebar-toggle-btn" (click)="toggleSidebar()" title="Toggle Sidebar (Slide In / Out)">
            <span class="material-icons">menu</span>
        </button>

        <button type="button" 
                class="nav-back-btn" 
                (click)="goBack()" 
                [class.active-back]="canGoBack"
                [title]="canGoBack ? 'Go back to previous page or dashboard' : 'Return to main dashboard'">
            <span class="material-icons back-arrow-icon">arrow_back</span>
            <span class="nav-back-text">Back</span>
        </button>
        <div class="brand-logo-badge">
            <span class="material-icons brand-icon">school</span>
        </div>
        <div class="brand-info">
            <span class="brand-title">SIDDHI</span>
            <span class="brand-subtitle">Smart Outcome-Based Learning Management System</span>
        </div>
    </div>

    <div class="navbar-center">
        <div class="portal-status-pill">
            <span class="status-dot"></span>
            <span class="portal-name">{{ (role | uppercase) || 'PORTAL' }} CONSOLE</span>
        </div>
    </div>

    <div class="navbar-right">
        <div class="user-profile-badge" *ngIf="userName">
            <div class="user-avatar-circle">
                {{ userName.charAt(0).toUpperCase() }}
            </div>
            <div class="user-text-info">
                <span class="user-display-name">{{ userName }}</span>
                <span class="user-role-label">{{ role | titlecase }}</span>
            </div>
        </div>

        <button class="nav-logout-btn" (click)="logout()" title="Logout from System">
            <span class="material-icons logout-icon">logout</span>
            <span>Sign Out</span>
        </button>
    </div>
</header>
