<!-- Floating Chat Button -->
<button class="chat-float-btn" (click)="toggleChat()" title="Chat with OBLMS Academic AI Assistant">
  <span class="float-icon">🤖</span>
  <span class="float-pulse"></span>
</button>

<!-- Chat Window -->
<div class="chat-popup" *ngIf="isOpen">
  <div class="chatbot-card">
    <div class="chat-header">
      <div class="header-bot-info">
        <div class="bot-avatar">🤖</div>
        <div>
          <h3>OBLMS Academic AI</h3>
          <span class="bot-status"><span class="status-dot"></span> Online • Outcome-Based AI Assistant</span>
        </div>
      </div>
      <button class="close-btn" (click)="toggleChat()" title="Close chat">✕</button>
    </div>

    <div class="chat-body">
      <!-- Quick Prompt Chips -->
      <div class="quick-prompts-bar">
        <button 
          *ngFor="let p of quickPrompts" 
          type="button" 
          class="quick-prompt-pill" 
          (click)="sendQuickPrompt(p)">
          {{ p }}
        </button>
      </div>

      <!-- Messages Area -->
      <div class="messages">
        <div
          *ngFor="let message of messages"
          [ngClass]="{
            'message-user': message.from === 'user',
            'message-bot': message.from === 'bot'
          }"
          class="message-row">

          <div class="bubble-wrap">
            <div class="message-label">
              {{ message.from === 'user' ? '👤 You' : '🤖 Academic AI' }}
            </div>

            <div class="message-text">
              {{ message.text }}
            </div>

            <!-- Bot Quick Action Button -->
            <div class="quick-action-container" *ngIf="message.quickAction">
              <button class="btn-quick-action" (click)="clickSuggestion(message.quickAction.route)">
                {{ message.quickAction.label }} →
              </button>
            </div>
          </div>
        </div>

        <!-- Quick Navigation Suggestions -->
        <div class="suggestions-wrap" *ngIf="suggestions.length > 0">
          <span class="suggestion-label">Suggested Shortcuts:</span>
          <div class="suggestion-chips">
            <button *ngFor="let s of suggestions" type="button" class="chip-btn" (click)="clickSuggestion(s.route)">
              {{ s.label }} →
            </button>
          </div>
        </div>
      </div>

      <!-- Chat Actions & Voice Input -->
      <div class="chat-actions">
        <form class="chat-form" (ngSubmit)="sendMessage()">
          <div class="input-container">
            <input
              type="text"
              [(ngModel)]="userMessage"
              (ngModelChange)="onInputChange()"
              name="message"
              placeholder="Ask about attendance, safe bunks, COs, exams..." 
              class="custom-chat-input"
              autocomplete="off"
            />
            <button type="submit" class="send-icon-btn" title="Send message" [disabled]="!userMessage.trim()">
              ➤
            </button>
          </div>
        </form>

        <div class="voice-controls">
          <button
            type="button"
            class="mic-pill-btn"
            [class.listening]="isListening"
            (click)="toggleVoice()">
            {{ isListening ? '⏹️ Stop' : '🎙️ Speak' }}
          </button>

          <span class="voice-status-text" [class.active-voice]="isListening">{{ voiceStatus }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
